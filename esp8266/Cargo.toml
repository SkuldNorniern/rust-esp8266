[package]
name = "esp8266"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "The Arduino esp8266 core from Rust: time, serial, pins, i2c, wifi, udp and flash"

[features]
default = ["panic-handler"]
# prints the panic on serial and restarts
panic-handler = []

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
